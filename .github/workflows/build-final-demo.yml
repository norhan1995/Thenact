name: Build final ThenAct demo

on:
  push:
    paths:
      - ".github/workflows/build-final-demo.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Download natural-voice Descript cut
        run: |
          curl -L --fail --retry 3             'https://media.descriptusercontent.com/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F19705f07-1f2f-43a6-9866-2ab3ffafc02a%2Fhls%3Fexpiration%3D1790441090255%26signature%3De472dadc7201069efc855248554dc92a5269901e8f6b0fc8e66e93cd93dc82ac&filename=ThenAct+Demo.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1790437490&signature=9d9d8e76f6f6452c6e08387f9f3a20992330322700e3263e8bbdf25db0d6e1ae'             -o source.mp4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Tighten to under 90 seconds
        run: |
          ffmpeg -y -i source.mp4             -filter_complex "[0:v]setpts=PTS/1.09676[v];[0:a]atempo=1.09676[a]"             -map "[v]" -map "[a]"             -t 89.5             -c:v libx264 -preset medium -crf 20             -c:a aac -b:a 192k             -movflags +faststart             ThenAct_90s_DOO_Demo_NATURAL_FINAL.mp4

      - name: Verify output
        run: |
          ffprobe -v error -show_entries format=duration             -of default=noprint_wrappers=1:nokey=1             ThenAct_90s_DOO_Demo_NATURAL_FINAL.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: ThenAct-final-natural-video
          path: ThenAct_90s_DOO_Demo_NATURAL_FINAL.mp4
          if-no-files-found: error
          retention-days: 7
